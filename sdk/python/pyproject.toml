[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nori-face"
version = "0.1.0"
description = "Render Nori face packs on a robot's display"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nori-face = "nori_face.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nori_face"]

[tool.hatch.build.targets.wheel.force-include]
"nori_face/_bundle" = "nori_face/_bundle"

[tool.pytest.ini_options]
testpaths = ["tests"]
